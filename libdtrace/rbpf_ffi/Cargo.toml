[package]
name = "rbpf_ffi"
version = "0.1.0"
edition = "2021"
authors = ["Oracle"]
description = "FFI bindings for rbpf to enable DTrace on non-Linux systems"
license = "UPL-1.0"

[lib]
name = "rbpf_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
rbpf = "0.3"
libc = "0.2"

[target.'cfg(target_os = "redox")'.dependencies]
# RedoxOS-specific dependencies if needed
redox_syscall = "0.4"

[features]
default = ["std"]
std = ["rbpf/std"]
# RedoxOS support - disables JIT which requires mmap with PROT_EXEC
redox = []
no-jit = []

[profile.release]
opt-level = 3
lto = true

# RedoxOS profile - smaller binary, no JIT
[profile.release-redox]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"

# Use our patched rbpf for RedoxOS support (getrandom instead of rand)
[patch.crates-io]
rbpf = { path = "rbpf-patched" }
